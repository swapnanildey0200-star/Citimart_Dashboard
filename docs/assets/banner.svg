<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow-cyan)"/>
  <circle cx="1080" cy="320" r="180" fill="#8b5cf6" opacity="0.15" filter="url(#glow-purple)"/>
  <circle cx="650" cy="200" r="120" fill="#10b981" opacity="0.08" filter="url(#glow-cyan)"/>

  <!-- Top Decorative Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent-cyan)"/>

  <!-- Brand Logo & Badge -->
  <g transform="translate(60, 52)">
    <!-- Logo Icon Container -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#0f172a" stroke="url(#card-border)" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Logo Graphic: Retail Analytics Icon -->
    <g transform="translate(13, 13)">
      <path d="M4 22 L4 12 A2 2 0 0 1 6 10 L24 10 A2 2 0 0 1 26 12 L26 22 A2 2 0 0 1 24 24 L6 24 A2 2 0 0 1 4 22 Z" fill="none" stroke="#06b6d4" stroke-width="2"/>
      <path d="M10 10 L10 6 A5 5 0 0 1 20 6 L20 10" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <path d="M9 19 L13 14 L17 17 L21 12" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="21" cy="12" r="1.5" fill="#34d399"/>
    </g>

    <!-- Platform Category Badge -->
    <g transform="translate(70, 4)">
      <rect x="0" y="0" width="195" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="10" cy="11" r="4" fill="#10b981"/>
      <text x="20" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">RETAIL INTELLIGENCE SUITE</text>
    </g>

    <!-- Main Title -->
    <text x="70" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">CITIMART DASHBOARD</text>

    <!-- Subtitle -->
    <text x="0" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Enterprise POS &amp; Stock Ingestion • Real-Time KPIs • <tspan fill="#38bdf8" font-weight="600">4-Question Management Action Engine</tspan>
    </text>
  </g>

  <!-- 4-Questions Interactive Pill Badges -->
  <g transform="translate(60, 172)">
    <!-- Question 1 -->
    <g transform="translate(0, 0)">
      <rect width="125" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="19" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">1. What happened?</text>
    </g>
    <!-- Question 2 -->
    <g transform="translate(135, 0)">
      <rect width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="19" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="700">2. Where did it happen?</text>
    </g>
    <!-- Question 3 -->
    <g transform="translate(275, 0)">
      <rect width="125" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="19" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="700">3. Why did it happen?</text>
    </g>
    <!-- Question 4 -->
    <g transform="translate(410, 0)">
      <rect width="135" height="30" rx="8" fill="#132e27" stroke="#059669" stroke-width="1"/>
      <text x="12" y="19" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">4. What action to take?</text>
    </g>
  </g>

  <!-- Live KPI Metrics Showcase Cards -->
  <g transform="translate(60, 222)">
    
    <!-- KPI Card 1: Total Net Sales -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="250" height="106" rx="12" fill="url(#card-grad)" stroke="url(#card-border)" stroke-width="1"/>
      <!-- Label -->
      <text x="16" y="28" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">TOTAL NET SALES (TY)</text>
      <!-- Sparkline icon -->
      <path d="M 215 22 L 222 17 L 228 20 L 236 14" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
      <!-- Value -->
      <text x="16" y="62" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">₹ 4.82 Cr</text>
      <!-- Badge -->
      <rect x="16" y="74" width="70" height="18" rx="4" fill="#064e3b" opacity="0.6"/>
      <text x="22" y="87" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">↑ +14.2% YoY</text>
      <text x="94" y="87" fill="#64748b" font-family="sans-serif" font-size="11">vs LY ₹ 4.22 Cr</text>
    </g>

    <!-- KPI Card 2: Gross Margin % -->
    <g transform="translate(270, 0)" filter="url(#card-shadow)">
      <rect width="250" height="106" rx="12" fill="url(#card-grad)" stroke="url(#card-border)" stroke-width="1"/>
      <text x="16" y="28" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">GROSS MARGIN</text>
      <path d="M 215 20 L 222 23 L 228 17 L 236 15" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <text x="16" y="62" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">38.4%</text>
      <rect x="16" y="74" width="66" height="18" rx="4" fill="#082f49" opacity="0.6"/>
      <text x="22" y="87" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">↑ +2.1 pts</text>
      <text x="90" y="87" fill="#64748b" font-family="sans-serif" font-size="11">Healthy realization</text>
    </g>

    <!-- KPI Card 3: Stock Gap & Cover -->
    <g transform="translate(540, 0)" filter="url(#card-shadow)">
      <rect width="260" height="106" rx="12" fill="url(#card-grad)" stroke="url(#card-border)" stroke-width="1"/>
      <text x="16" y="28" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">STOCK COVER &amp; VELOCITY</text>
      <circle cx="225" cy="22" r="5" fill="#f59e0b"/>
      <text x="16" y="62" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">34 Days</text>
      <rect x="16" y="74" width="76" height="18" rx="4" fill="#451a03" opacity="0.6"/>
      <text x="22" y="87" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">Normal Range</text>
      <text x="100" y="87" fill="#64748b" font-family="sans-serif" font-size="11">5 Ageing Buckets</text>
    </g>

    <!-- KPI Card 4: Architecture & Dual-Store -->
    <g transform="translate(820, 0)" filter="url(#card-shadow)">
      <rect width="260" height="106" rx="12" fill="url(#card-grad)" stroke="url(#card-border)" stroke-width="1"/>
      <text x="16" y="28" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">RESILIENT DUAL-STORE</text>
      <circle cx="225" cy="22" r="5" fill="#10b981"/>
      <text x="16" y="62" fill="#10b981" font-family="sans-serif" font-size="20" font-weight="800">Atlas + In-Memory</text>
      <rect x="16" y="74" width="80" height="18" rx="4" fill="#1e293b"/>
      <text x="22" y="87" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="600">Zero-Downtime</text>
      <text x="108" y="87" fill="#64748b" font-family="sans-serif" font-size="11">Auto-Fallback</text>
    </g>

  </g>

  <!-- Bottom Technology Badges Strip -->
  <g transform="translate(60, 365)">
    <!-- FastAPI -->
    <rect x="0" y="0" width="85" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="14" y="16" fill="#009688" font-family="sans-serif" font-size="11" font-weight="700">⚡ FastAPI</text>

    <!-- React 19 -->
    <rect x="95" y="0" width="90" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="109" y="16" fill="#61dafb" font-family="sans-serif" font-size="11" font-weight="700">⚛ React 19</text>

    <!-- Vite -->
    <rect x="195" y="0" width="75" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="210" y="16" fill="#bd34fe" font-family="sans-serif" font-size="11" font-weight="700">⚡ Vite 8</text>

    <!-- Tailwind CSS v4 -->
    <rect x="280" y="0" width="115" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="292" y="16" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">🎨 Tailwind v4</text>

    <!-- MongoDB Atlas -->
    <rect x="405" y="0" width="115" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="417" y="16" fill="#47a248" font-family="sans-serif" font-size="11" font-weight="700">🍃 MongoDB</text>

    <!-- Python 3.14 -->
    <rect x="530" y="0" width="100" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="542" y="16" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">🐍 Python 3.14</text>

    <!-- Right-aligned build status indicator -->
    <g transform="translate(870, 4)">
      <circle cx="0" cy="8" r="4" fill="#10b981"/>
      <text x="12" y="12" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">PRODUCTION READY • ZERO-DIVISION SAFE</text>
    </g>
  </g>
</svg>
